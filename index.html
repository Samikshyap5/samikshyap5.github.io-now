<body>
<div class="app">
  <header>
    <div><div class="brand">NOW</div><div class="tag">Choose what matters. Do it now. Rest without guilt.</div></div>
    <div id="resetArea"></div>
  </header>
  <div id="app"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- storage ---------- */
const KEY='now_v2';
let storageOk=true;
const blank=()=>({
  tasks:[],proof:[],bank:{earned:0,spent:0},
  pantry:[],meals:[],workouts:[],books:[],places:[],dream:[],movies:[],songs:[],ideas:[],
  ui:{tab:'now',avail:60,focus:'core',mood:'all',feeling:'all',need:'',office:false}
});
function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){const o=JSON.parse(r);const b=blank();return Object.assign(b,o,{ui:Object.assign(b.ui,o.ui||{})});}
  }catch(e){storageOk=false;}
  return blank();
}
let D=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){storageOk=false;}}

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
function fmt(m){
  m=Math.round(m);
  if(m<60)return m+' min';
  const h=Math.floor(m/60),r=m%60;
  return r?`${h} hr ${r} min`:`${h} hr${h>1?'s':''}`;
}
const bal=()=>Math.max(0,D.bank.earned-D.bank.spent);
const DAY=864e5;
const isToday=t=>new Date(t).toDateString()===new Date().toDateString();
const find=(list,id)=>D[list].find(x=>String(x.id)===String(id));
const yt=q=>'https://www.youtube.com/results?search_query='+encodeURIComponent(q);
const roundTo=(m,s)=>Math.max(s,Math.round(m/s)*s);
let toastT;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3400);}
function addProof(type,text,minutes,feel,finished){
  D.proof.push({id:uid(),type,text,minutes:minutes||0,feel:feel||'',finished:!!finished,at:Date.now()});
}
function weekWork(){
  const since=Date.now()-7*DAY;
  const w=D.proof.filter(p=>p.at>=since&&(p.type==='task'||p.type==='workout'));
  return {mins:w.reduce((s,p)=>s+p.minutes,0),count:w.length};
}
function belief(){
  const w=weekWork();
  if(w.mins>0)return `This week you put ${fmt(w.mins)} into things you decided mattered. You have done this before, so you can begin.`;
  if(D.proof.some(p=>p.type==='task'||p.type==='workout'))return 'You have shown up for something that mattered before. This is the same move.';
  return 'Your first proof starts with one small session. You only have to begin.';
}

/* ---------- static knowledge ---------- */
const TABS=[['now','🌸 Now'],['rack','📋 Rack'],['food','🍽️ Food'],['strong','💪 Strong'],['books','📚 Books'],['places','🗺️ Places'],['movies','🎬 Movies'],['songs','🎵 Songs'],['ideas','💡 Ideas'],['proof','🌱 Proof']];

const STARTERS=[
  {name:'Vegetable fried rice',ings:['rice','egg','onion','carrot'],office:true,mins:20},
  {name:'Dal and rice',ings:['lentils','rice','onion','tomato'],office:true,mins:35},
  {name:'Egg sandwich',ings:['bread','egg','tomato'],office:true,mins:10},
  {name:'Oats with fruit',ings:['oats','milk','banana'],office:true,mins:5},
  {name:'Chickpea salad',ings:['chickpeas','onion','tomato','cucumber'],office:true,mins:10},
  {name:'Vegetable noodles',ings:['noodles','onion','cabbage','carrot'],office:true,mins:20},
  {name:'Egg roll wrap',ings:['roti','egg','onion'],office:true,mins:12},
  {name:'Yogurt bowl',ings:['yogurt','banana','oats'],office:true,mins:5},
  {name:'Potato curry with rice',ings:['potato','onion','tomato','rice'],office:false,mins:35}
];

const FOCUS={core:'Core',legs:'Legs',arms:'Arms & shoulders',back:'Back & posture',cardio:'Cardio',flex:'Flexibility'};
const EX={
  core:[['Plank','Mat','Hold 3 rounds of 30 to 45 seconds. Keep hips level.'],['Dead bug','Mat','Slow opposite arm and leg. Lower back stays down.'],['Bicycle crunch','Mat','Controlled, not fast. 3 sets of 12 each side.'],['Hanging knee raise','Pull-up bar','Lift knees without swinging. 3 sets of 8.'],['Ab wheel rollout','Ab wheel','Advanced. Build up with planks first.']],
  legs:[['Bodyweight squat','None','3 sets of 15. Knees track over toes.'],['Reverse lunge','None','3 sets of 10 each leg.'],['Glute bridge','Mat','3 sets of 15. Squeeze at the top.'],['Step-up','Chair or step','3 sets of 10 each leg on a sturdy step.'],['Goblet squat','Dumbbells','Hold one weight at your chest. 3 sets of 12.']],
  arms:[['Push-up','None','Knees down if needed. 3 sets to near fatigue.'],['Chair dip','Chair or step','3 sets of 10. Keep shoulders down.'],['Pike push-up','None','Builds shoulders. 3 sets of 8.'],['Dumbbell curl','Dumbbells','3 sets of 12, slow on the way down.'],['Band overhead press','Resistance band','3 sets of 12.']],
  back:[['Bird dog','Mat','3 sets of 10 each side. Move slowly.'],['Superman hold','Mat','3 holds of 20 seconds.'],['Wall angel','None','2 sets of 12. Posture reset.'],['Band row','Resistance band','3 sets of 12. Squeeze shoulder blades.'],['Pull-up or negative','Pull-up bar','Lower yourself slowly for 5 seconds.']],
  cardio:[['Brisk walk','None','30 minutes at a pace where talking is possible.'],['Jump rope','Jump rope','5 rounds of 1 minute with 30 seconds rest.'],['Stair climbing','None','10 minutes, steady.'],['High knees and squats circuit','None','4 rounds of 40 seconds work, 20 seconds rest.']],
  flex:[['Cat-cow','Mat','10 slow rounds. Loosens the spine.'],['Hip flexor stretch','Mat','60 seconds each side.'],['Hamstring stretch','None','45 seconds each leg.'],["Child's pose",'Mat','Breathe for 60 seconds.']]
};
const TOOLNOTE={
  'Mat':'A thin yoga mat makes floor work comfortable. It is the first thing worth buying.',
  'Resistance band':'Cheap, light and covers back, arms and legs. The second thing worth buying.',
  'Dumbbells':'One adjustable pair covers most arm and leg work.',
  'Pull-up bar':'A door-frame bar opens up back and core work.',
  'Ab wheel':'Optional and advanced. Learn planks first.',
  'Chair or step':'Any sturdy chair or stair works. No purchase needed.',
  'Jump rope':'Very cheap cardio you can do anywhere.'
};
const NEEDS={
  calm:['Feel calmer','Try poetry, gentle literary fiction, or mindfulness writing.'],
  skill:['Learn a skill','Try practical non-fiction and how-to books. Pick one topic and stay with it.'],
  think:['Think differently','Try philosophy, popular science, or essay collections.'],
  escape:['Escape for a while','Try fantasy, mystery, or science fiction.'],
  inspire:['Feel inspired','Try biography and memoir. Real lives are a strong push.']
};
const GENRES=['Fiction','Non-fiction','Self-growth','Biography','Science','Philosophy','Fantasy','Mystery','Poetry','History','Other'];
const MOODS=['Comforting','Thoughtful','Funny','Inspiring','Thrilling','Emotional'];
const FEELINGS=['Calm','Energised','Comfort','Focused','Happy','Release'];

/* ---------- idea estimates ---------- */
function estimate(title,details){
  const t=(title+' '+details).toLowerCase();
  let kind,base,parts,start;
  if(/\b(app|apps|website|web|software|game|system|platform|tool|program|code)\b/.test(t)){
    kind='Something to build';base=480;
    parts=[['Learn what you need',.25],['Build a first version',.5],['Try it with one real person',.15],['Improve and share',.1]];
    start='Write in one sentence what a person should be able to do with it, then sketch one screen.';
  }else if(/\b(video|film|movie|youtube|channel|documentary|reel)\b/.test(t)){
    kind='A video project';base=240;
    parts=[['Plan and research',.25],['Record',.3],['Edit',.3],['Publish',.15]];
    start='Write the one-sentence point of the video.';
  }else if(/\b(book|novel|ebook|story|write|writing|blog)\b/.test(t)){
    kind='A writing project';base=360;
    parts=[['Outline',.2],['Write the first draft',.55],['Revise',.2],['Prepare to share',.05]];
    start='Write five bullet points: what the reader should feel or know at the end.';
  }else if(/\b(learn|course|study|skill|practice|language)\b/.test(t)){
    kind='A skill to learn';base=180;
    parts=[['Find one good resource',.15],['Practise',.6],['Test yourself',.25]];
    start='Pick one resource and do the first lesson only.';
  }else if(/\b(trip|travel|visit|journey)\b/.test(t)){
    kind='A trip';base=150;
    parts=[['Decide where and when',.25],['Budget and book',.45],['Prepare',.3]];
    start='Write down the dates you could go and a rough budget.';
  }else if(/\b(craft|paint|draw|sew|cook|garden|make|build)\b/.test(t)){
    kind='Something to make';base=240;
    parts=[['Gather materials',.2],['Make a first version',.55],['Improve it',.25]];
    start='List what you need and make the smallest possible version.';
  }else{
    kind='An open idea';base=120;
    parts=[['Say what done looks like',.25],['Make a first version',.5],['Review and improve',.25]];
    start='Write one sentence that says what finished looks like.';
  }
  const low=roundTo(base*.7,30),high=roundTo(base*1.4,30);
  return {kind,low,high,start,parts:parts.map(p=>({label:p[0],min:roundTo(base*p[1],15)}))};
}

/* ---------- recommendation ---------- */
let skip=[],pin=null;
function pickTask(avail){
  let open=D.tasks.filter(t=>!t.done);
  if(pin){const p=open.find(t=>t.id===pin);if(p)return {t:p,mode:p.remaining<=avail?'fit':'piece'};pin=null;}
  let pool=open.filter(t=>!skip.includes(t.id));
  if(!pool.length&&open.length){skip=[];pool=open;}
  if(!pool.length)return null;
  const order=(a,b)=>b.priority-a.priority||a.created-b.created;
  const top=[...pool].sort(order)[0];
  const bestFit=pool.filter(t=>t.remaining<=avail).sort(order)[0];
  if(bestFit&&bestFit.priority>=top.priority)return {t:bestFit,mode:'fit'};
  return {t:top,mode:top.remaining<=avail?'fit':'piece'};
}

/* ---------- session ---------- */
let S=null,tickId=null;
const clockText=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function paintClock(){
  if(!S)return;
  const t=clockText(S.left);
  ['clock','bclock'].forEach(i=>{const e=$(i);if(e)e.textContent=t;});
}
function tick(){
  if(!S||S.state!=='running')return;
  S.left=Math.max(0,Math.round((S.end-Date.now())/1000));
  if(S.left<=0){finishSession(S.min);toast('Session complete. Nice work.');}
  else paintClock();
}
function startSession(id,min){
  clearInterval(tickId);
  S={taskId:id,min,left:min*60,end:Date.now()+min*60000,state:'running',worked:0};
  tickId=setInterval(tick,1000);
  render();
}
function finishSession(w){clearInterval(tickId);S.state='finished';S.worked=w;render();}
function stopSession(){
  const worked=Math.floor((S.min*60-S.left)/60);
  if(worked<1){clearInterval(tickId);S=null;toast('Stopped. No time logged.');render();return;}
  finishSession(worked);
}
function completeWork(t,w,done,feel){
  if(t){
    t.remaining=done?0:Math.max(0,t.remaining-w);
    if(t.remaining===0){t.done=true;t.doneAt=Date.now();}
  }
  D.bank.earned+=w;
  addProof('task',t?t.title:'A work session',w,feel,t&&t.done);
  if(t&&t.done&&pin===t.id)pin=null;
  save();
  toast(t&&t.done?`Done. That is proof. +${fmt(w)} in your free-time bank.`:`Progress logged. +${fmt(w)} in your free-time bank.`);
}
function resolveSession(done){
  const t=D.tasks.find(x=>x.id===S.taskId);
  const feel=(($('feelIn')||{}).value||'').trim();
  completeWork(t,S.worked,done,feel);
  S=null;render();
}

/* ---------- views ---------- */
function opts(vals,cur,label){return vals.map(v=>`<option value="${v}"${String(v)===String(cur)?' selected':''}>${esc(label?label(v):v)}</option>`).join('');}
const durLabel=v=>fmt(+v);
function chips(list,cur,act,allLabel){
  const all=allLabel?[['all',allLabel]].concat(list.map(x=>[x,x])):list.map(x=>[x,x]);
  return `<div class="chips">${all.map(([v,l])=>`<button type="button" class="chip${cur===v?' on':''}" data-act="${act}" data-v="${esc(v)}">${esc(l)}</button>`).join('')}</div>`;
}
function delBtn(list,id){return `<button class="btn small danger" data-act="del" data-list="${list}" data-id="${id}" aria-label="Remove">Remove</button>`;}
const PRI={3:['Priority','P'],2:['Important','I'],1:['Optional','O']};

function viewNow(){
  const avail=D.ui.avail;
  const dateStr=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  let h=`<section class="hero"><small>${esc(dateStr)}</small><h1>What deserves your attention now?</h1>
  <p>Pick what is worth the time you have, and start. Rest never has to be earned.</p>
  <div class="row"><label class="muted" for="availSel" style="color:#fff">I have</label>
  <select id="availSel" data-change="avail">${opts([15,30,45,60,90,120,180],avail,durLabel)}</select>
  <button class="btn light" data-act="recalc">Show me</button></div></section>`;

  let rec='';
  if(S&&S.state==='running'){
    const t=D.tasks.find(x=>x.id===S.taskId);
    rec=`<div class="rec"><div class="kind">Protected session</div><h3>${esc(t?t.title:'Focus session')}</h3>
    <div class="clock" id="clock">${clockText(S.left)}</div>
    ${t&&t.why?`<p><b>Why it matters:</b> ${esc(t.why)}</p>`:''}
    <p class="belief">You decided this was worth it. Just stay with it until the timer ends.</p>
    <button class="btn" data-act="stop">Stop and log the time I did</button></div>`;
  }else if(S&&S.state==='finished'){
    const t=D.tasks.find(x=>x.id===S.taskId);
    rec=`<div class="rec"><div class="kind">Session complete</div><h3>${fmt(S.worked)} on ${esc(t?t.title:'your task')}</h3>
    <p>That time is now proof. It adds ${fmt(S.worked)} to your free-time bank.</p>
    <div class="form"><input id="feelIn" placeholder="How did it feel to do this? (optional)"></div>
    <div class="row" style="margin-top:10px"><button class="btn pri" data-act="resolve" data-done="1">It is finished</button>
    <button class="btn soft" data-act="resolve" data-done="0">Log progress, more to do</button></div></div>`;
  }else{
    const pk=pickTask(avail);
    if(!pk){
      rec=`<div class="rec"><div class="kind">Nothing waiting</div><h3>Your priorities are clear.</h3>
      <p>The system will not invent work to keep you busy. Rest, enjoy something below, or put something new on your Rack.</p>
      <div class="row"><button class="btn pri" data-act="rest">Rest for ${fmt(avail)}, guilt-free</button><button class="btn soft" data-act="tab" data-tab="rack">Add to Rack</button></div></div>`;
    }else{
      const t=pk.t,sess=Math.min(t.remaining,avail);
      const line=pk.mode==='fit'
        ?`This fits your ${fmt(avail)}.`
        :`This needs ${fmt(t.remaining)} and you have ${fmt(avail)}. Today is a first piece, and a first piece counts.`;
      rec=`<div class="rec"><div class="kind">${pk.mode==='fit'?'Worth your time now':'A first piece'}</div>
      <h3>${esc(t.title)}</h3>
      <div class="tags"><span class="badge">${PRI[t.priority][0]}</span><span class="badge blue">${fmt(t.remaining)} left</span></div>
      <p>${esc(line)}</p>
      <p><b>Why it matters:</b> ${esc(t.why)}</p>
      ${t.gives?`<p><b>What finishing creates:</b> ${esc(t.gives)}</p>`:''}
      <div class="reward">Doing ${fmt(sess)} of this adds ${fmt(sess)} to your free-time bank.</div>
      <div class="hl"><b>Is this worth your time right now?</b><br>${esc(belief())}</div>
      <div class="row"><button class="btn pri" data-act="start" data-id="${t.id}" data-min="${sess}">Yes — start ${fmt(sess)}</button>
      ${sess>10?`<button class="btn soft" data-act="start" data-id="${t.id}" data-min="10">Yes, but just 10 minutes</button>`:''}
      <button class="btn" data-act="markdone" data-id="${t.id}">Already done</button>
      <button class="btn" data-act="keepidea" data-id="${t.id}">Not now — keep as an idea</button>
      <button class="btn" data-act="another">Show another</button>
      <button class="btn" data-act="rest">Rest instead</button></div></div>`;
    }
  }
  h+=`<div class="card"><h2>Your recommendation</h2>${rec}</div>`;

  h+=`<div class="card"><h2>For you, no guilt attached</h2><p class="sub">Nothing here needs to be earned. These are ideas for when you want something for yourself.</p>${freePicks()}</div>`;

  const earnedToday=D.proof.filter(p=>isToday(p.at)&&(p.type==='task'||p.type==='workout')).reduce((s,p)=>s+p.minutes,0);
  const w=weekWork();
  const rests=D.proof.filter(p=>p.type==='rest').length;
  h+=`<div class="grid2"><div class="card"><h2>Free-time bank</h2>
    <div class="big">${fmt(bal())}</div>
    <p class="muted">Earned today: ${fmt(earnedToday)}. Your work buys time you can spend on yourself. Rest and fun never need a balance. This only shows what your work has bought.</p>
    <div class="row"><button class="btn soft small" data-act="spend" data-min="30">Spend 30 min</button><button class="btn soft small" data-act="spend" data-min="60">Spend 1 hr</button></div></div>
    <div class="card"><h2>Your proof this week</h2>
    <div class="big">${fmt(w.mins)}</div>
    <p class="muted">${w.count} session${w.count===1?'':'s'} on things you decided mattered. Rested on purpose ${rests} time${rests===1?'':'s'} in total. Resting is part of the system.</p>
    <button class="btn small" data-act="tab" data-tab="proof">See all proof</button></div></div>`;
  return h;
}

function bestMeals(){
  const have=i=>{i=i.toLowerCase().trim();return D.pantry.some(p=>{const q=p.toLowerCase();return q.includes(i)||i.includes(q);});};
  const all=[...D.meals.map(m=>({...m,own:true})),...STARTERS.map((m,i)=>({...m,id:'s'+i}))];
  return all.map(m=>{const miss=m.ings.filter(i=>!have(i));return {...m,miss,score:(m.ings.length-miss.length)/m.ings.length};})
    .filter(m=>!D.ui.office||m.office).sort((a,b)=>b.score-a.score||a.mins-b.mins);
}
function freePicks(){
  const av=D.ui.avail,day=Math.floor(Date.now()/DAY),p=[];
  const meal=bestMeals().find(m=>m.score===1&&D.pantry.length);
  if(meal)p.push(['🍽️','Food',`You can make ${meal.name}`,'food']);
  const ex=EX[D.ui.focus][0];p.push(['💪','Strong',`${FOCUS[D.ui.focus]}: ${ex[0]}`,'strong']);
  const bk=D.books.find(b=>b.status==='Reading')||D.books.find(b=>b.status==='Want to read');
  if(bk)p.push(['📚','Book',bk.title,'books']);
  const pl=D.places.filter(x=>x.mins<=av);
  if(pl.length)p.push(['🗺️','Place that fits now',pl[day%pl.length].name,'places']);
  const mv=D.movies.filter(m=>!m.watched);
  if(mv.length)p.push(['🎬','Movie',`${mv[day%mv.length].title} (${mv[day%mv.length].mood.toLowerCase()})`,'movies']);
  if(D.songs.length){const s=D.songs[day%D.songs.length];p.push(['🎵','Song',`${s.title} (${s.feeling.toLowerCase()})`,'songs']);}
  return `<div class="picks">${p.map(x=>`<button class="pick" data-act="tab" data-tab="${x[3]}"><span>${x[0]} ${esc(x[1])}</span><b>${esc(x[2])}</b></button>`).join('')}</div>`;
}

function render(){
  const keep={};

    document.querySelectorAll('#app [name]').forEach(e=>{
      if(e.tagName==='SELECT')return;
      keep[e.closest('form')?.dataset.form+':'+e.name]=e.type==='checkbox'?e.checked:e.value;
    });
  }
  const t=D.ui.tab;
  const views={now:viewNow,rack:viewRack,food:viewFood,strong:viewStrong,books:viewBooks,places:viewPlaces,movies:viewMovies,songs:viewSongs,ideas:viewIdeas,proof:viewProof};
  let h=`<nav class="nav" aria-label="Shelves">${TABS.map(x=>`<button class="${t===x[0]?'on':''}" data-act="tab" data-tab="${x[0]}">${x[1]}</button>`).join('')}</nav>`;
  if(!storageOk)h+=`<div class="banner">Saving is not available in this view, so your data will be lost when you close it.</div>`;
  if(S&&S.state==='running'&&t!=='now')h+=`<div class="banner"><span>Protected session running: <b id="bclock">${clockText(S.left)}</b></span><button class="btn small" data-act="tab" data-tab="now">Back to Now</button></div>`;
  if(S&&S.state==='finished'&&t!=='now')h+=`<div class="banner"><span>Your session is complete.</span><button class="btn small pri" data-act="tab" data-tab="now">Log it</button></div>`;
  h+=(views[t]||viewNow)();
  $('app').innerHTML=h;
  if(lastTab===t){
    document.querySelectorAll('#app [name]').forEach(e=>{
      if(e.tagName==='SELECT')return;
      const k=e.closest('form')?.dataset.form+':'+e.name;
      if(k in keep){if(e.type==='checkbox')e.checked=keep[k];else e.value=keep[k];}
    });
  }
  lastTab=t;
  $('resetArea').innerHTML=resetArmed
    ?`<span class="muted">Erase everything? </span><button class="btn small danger" data-act="reset-yes">Yes, erase</button> <button class="btn small" data-act="reset-no">Cancel</button>`
    :`<button class="btn small" data-act="reset">Reset</button>`;
}
let resetArmed=false;

/* ---------- actions ---------- */
function go(tab){D.ui.tab=tab;save();render();window.scrollTo({top:0});}
function meal2task(id){
  const m=bestMeals().find(x=>String(x.id)===String(id));if(!m)return;
  D.tasks.push({id:uid(),title:`Make ${m.name}`,priority:2,duration:roundTo(m.mins,5),remaining:roundTo(m.mins,5),why:'Eating well is what everything else runs on.',gives:m.office?'A good meal to take to the office':'A good meal at home',created:uid(),done:false});
  save();toast('Added to your Rack.');render();
}
const actions={
  tab:b=>go(b.dataset.tab),
  recalc:()=>{skip=[];pin=null;render();},
  another:()=>{const pk=pickTask(D.ui.avail);if(pk)skip.push(pk.t.id);pin=null;render();},
  start:b=>startSession(+b.dataset.id,+b.dataset.min),
  stop:()=>stopSession(),
  resolve:b=>resolveSession(b.dataset.done==='1'),
  markdone:b=>{const t=find('tasks',b.dataset.id);if(!t)return;completeWork(t,t.remaining,true,'');render();},
  do:b=>{pin=+b.dataset.id;skip=[];go('now');},
  keepidea:b=>{
    const t=find('tasks',b.dataset.id);if(!t)return;
    D.ideas.push({id:uid(),title:t.title,details:t.why,kind:'Kept from your Rack',low:t.remaining,high:Math.round(t.remaining*1.5),start:t.why||'Decide what the first small step looks like.',parts:[{label:'Do it',min:t.remaining}],planned:false});
    D.tasks=D.tasks.filter(x=>x.id!==t.id);
    if(pin===t.id)pin=null;
    save();toast('Kept. It is on your Ideas shelf, not lost.');render();
  },
  rest:()=>{addProof('rest','Rested on purpose',D.ui.avail);save();toast('Rest counts. Nothing was lost.');render();},
  spend:b=>{const m=Math.min(+b.dataset.min,bal());if(m<=0){toast('Your bank is empty, and that is fine. Enjoy your time anyway.');return;}D.bank.spent+=m;addProof('joy','Enjoyed free time you earned',m);save();toast(`Spent ${fmt(m)}. You earned it.`);render();},
  del:b=>{
    const l=b.dataset.list;
    if(l==='pantry')D.pantry=D.pantry.filter(x=>x!==b.dataset.v);
    else D[l]=D[l].filter(x=>String(x.id)!==String(b.dataset.id));
    save();render();
  },
  office:()=>{D.ui.office=!D.ui.office;save();render();},
  meal2task:b=>meal2task(b.dataset.id),
  focus:b=>{D.ui.focus=b.dataset.v;save();render();},
  ex2task:()=>{const f=FOCUS[D.ui.focus];D.tasks.push({id:uid(),title:`${f} session`,priority:2,duration:20,remaining:20,why:'A stronger body makes every other part of life easier.',gives:'A stronger body, and time in your bank',created:uid(),done:false});save();toast('Session added to your Rack.');render();},
  need:b=>{D.ui.need=D.ui.need===b.dataset.v?'':b.dataset.v;save();render();},
  bookstep:b=>{const x=find('books',b.dataset.id);if(x){x.status=x.status==='Want to read'?'Reading':'Read';save();render();}},
  visited:b=>{const x=find('places',b.dataset.id);if(x){x.visits=(x.visits||0)+1;addProof('joy','Visited '+x.name,x.mins);save();toast('Enjoy the memory.');render();}},
  mood:b=>{D.ui.mood=b.dataset.v;pickedMovie=null;save();render();},
  feeling:b=>{D.ui.feeling=b.dataset.v;pickedSong=null;save();render();},
  pickmovie:()=>{const l=D.movies.filter(x=>!x.watched&&(D.ui.mood==='all'||x.mood===D.ui.mood));if(!l.length){toast('Nothing unwatched for this mood. Add a movie first.');return;}pickedMovie=l[Math.floor(Math.random()*l.length)].id;render();},
  picksong:()=>{const l=D.songs.filter(x=>D.ui.feeling==='all'||x.feeling===D.ui.feeling);if(!l.length){toast('No songs for this feeling yet. Add one first.');return;}pickedSong=l[Math.floor(Math.random()*l.length)].id;render();},
  watched:b=>{const x=find('movies',b.dataset.id);if(x){x.watched=true;save();render();}},
  idea2plan:b=>{
    const i=find('ideas',b.dataset.id);if(!i)return;
    i.parts.forEach(p=>D.tasks.push({id:uid(),title:`${i.title}: ${p.label}`,priority:2,duration:p.min,remaining:p.min,why:i.details||`I want to turn "${i.title}" from a maybe into something real.`,gives:'One step closer to something real',created:uid(),done:false}));
    i.planned=true;save();toast('Steps added to your Rack.');render();
  },
  reset:()=>{resetArmed=true;render();},
  'reset-no':()=>{resetArmed=false;render();},
  'reset-yes':()=>{clearInterval(tickId);S=null;skip=[];pin=null;resetArmed=false;D=blank();save();render();toast('Everything erased.');}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const fn=actions[b.dataset.act];if(fn)fn(b);
});
document.addEventListener('change',e=>{
  const s=e.target.closest('[data-change]');if(!s)return;
  if(s.dataset.change==='avail'){D.ui.avail=+s.value;skip=[];save();render();}
});
const forms={
  task:d=>{D.tasks.push({id:uid(),title:d.title.trim(),priority:+d.priority,duration:+d.duration,remaining:+d.duration,why:d.why.trim(),gives:(d.gives||'').trim(),created:uid(),done:false});toast('Added to your Rack.');},
  pantry:d=>{d.items.split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{if(!D.pantry.some(p=>p.toLowerCase()===x.toLowerCase()))D.pantry.push(x);});},
  meal:d=>{D.meals.push({id:uid(),name:d.name.trim(),ings:d.ings.split(',').map(x=>x.trim()).filter(Boolean),mins:+d.mins,office:!!d.office});toast('Meal saved.');},
  workout:d=>{const m=+d.mins;D.workouts.push({id:uid(),focus:D.ui.focus,minutes:m,at:Date.now()});D.bank.earned+=m;addProof('workout',`${FOCUS[D.ui.focus]} session`,m,'',true);toast(`Logged. +${fmt(m)} in your free-time bank.`);},
  book:d=>{D.books.push({id:uid(),title:d.title.trim(),genre:d.genre,status:d.status});},
  place:d=>{D.places.push({id:uid(),name:d.name.trim(),mins:+d.mins,cost:d.cost,note:(d.note||'').trim(),visits:0});},
  dream:d=>{D.dream.push({id:uid(),name:d.name.trim(),budget:+d.budget,saved:+(d.saved||0)});},
  movie:d=>{D.movies.push({id:uid(),title:d.title.trim(),mood:d.mood,watched:false});},
  song:d=>{D.songs.push({id:uid(),title:d.title.trim(),feeling:d.feeling});},
  idea:d=>{const est=estimate(d.title,d.details||'');D.ideas.push({id:uid(),title:d.title.trim(),details:(d.details||'').trim(),...est,planned:false});}
};
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  const d=Object.fromEntries(new FormData(f).entries());
  if(f.dataset.form==='save'){
    const x=find('dream',f.dataset.id);if(x){x.saved+=+d.amt;toast('Saved toward your dream.');}
  }else if(forms[f.dataset.form]){forms[f.dataset.form](d);}
  f.reset();
  save();render();
});

render();
</script>
</body>
</html>
